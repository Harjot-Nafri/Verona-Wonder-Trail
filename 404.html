<style>
:root{--midnight:#010102;--violet:#7022FC;--orange:#FD8F32;--soft:#FFB36B;--lav:#C9A8FF}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  background:
    radial-gradient(75% 46% at 8% 6%,rgba(112,34,252,.9),transparent 70%),
    radial-gradient(70% 44% at 102% 100%,rgba(253,143,50,.78),transparent 70%),
    radial-gradient(50% 30% at 100% 0%,rgba(112,34,252,.5),transparent 70%),
    var(--midnight);
  color:#fff;font-family:'Outfit',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
}
.top{padding:22px 20px 0;text-align:center}
.top img{height:30px;width:auto;max-width:78%}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 24px 16px}
.num{
  display:flex;align-items:center;justify-content:center;gap:clamp(4px,2vw,14px);
  font-family:'Unbounded',sans-serif;font-weight:700;line-height:1;
  font-size:clamp(76px,26vw,150px);margin:0;
}
.num span{background:linear-gradient(180deg,#fff 10%,var(--lav) 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sym{width:.86em;height:.86em;flex:none;animation:spin 22s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1{
  font-family:'Newsreader',Georgia,serif;font-style:italic;font-weight:500;
  font-size:clamp(24px,6.4vw,34px);line-height:1.2;margin:22px 0 10px;max-width:15em;
}
p.lead{margin:0 0 28px;font-size:16px;line-height:1.5;color:rgba(255,255,255,.82);max-width:24em}
.btn{
  display:inline-block;padding:15px 28px;border-radius:999px;text-decoration:none;
  font-weight:600;font-size:16px;color:#010102;
  background:linear-gradient(135deg,var(--soft),var(--orange));
  box-shadow:0 10px 30px rgba(253,143,50,.35);
  transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(253,143,50,.45)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.alt{margin-top:18px;font-size:14px}
.alt a{color:rgba(255,255,255,.85);text-underline-offset:3px}
footer{padding:20px 20px 28px;text-align:center;font-size:12px;color:rgba(255,255,255,.7)}
footer a{color:rgba(255,255,255,.8);text-underline-offset:3px}
footer span{display:block;margin-top:8px}
@media (prefers-reduced-motion:reduce){.sym{animation:none}.btn{transition:none}}
</style>
</head>
<body>
<header class="top"><img src="/logo/logo-su-scuro.svg" alt="Verona Wonder Trail"><span id="langsw-slot" style="display:block;margin-top:14px"></span></header>
<main>
  <p class="num" role="img" aria-label="Errore 404">
    <span>4</span>
    <svg class="sym" viewBox="0 0 100 100" aria-hidden="true">
      <g stroke="#FD8F32" stroke-width="9" stroke-linecap="round">
        <g id="r"><line x1="50" y1="50" x2="50" y2="22"/><circle cx="50" cy="9" r="8" stroke="none" fill="#FD8F32"/></g>
        <use href="#r" transform="rotate(51.43 50 50)"/><use href="#r" transform="rotate(102.86 50 50)"/>
        <use href="#r" transform="rotate(154.29 50 50)"/><use href="#r" transform="rotate(205.71 50 50)"/>
        <use href="#r" transform="rotate(257.14 50 50)"/><use href="#r" transform="rotate(308.57 50 50)"/>
      </g>
    </svg>
    <span>4</span>
  </p>
  <h1>Questo sentiero non porta a nessuna sede.</h1>
  <p class="lead">La pagina che cerchi non esiste o è stata spostata. Torna alla mappa e riparti da lì.</p>
  <a class="btn" href="/">Torna al sito</a>
  <p class="alt"><a href="/#mappa">Vai alla mappa delle sedi</a></p>
</main>
<footer>
  <a href="/privacy.html">Privacy</a> · <a href="/crediti.html">Crediti</a>
  <span>Developed by Harjot Nafri</span>
</footer>
</body>
</html>
